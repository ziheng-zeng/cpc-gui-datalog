[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cpc-gui-datalog"
version = "0.1.0"
description = "Real-time CPC GUI data logger with serial acquisition and live plotting."
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "pyserial",
    "PyYAML",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cpc_log*"]

